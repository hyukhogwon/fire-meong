name: Deploy to S3 and CloudFront

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fire-meong-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET: fire-meong
      CF_DISTRIBUTION_ID: E3EYSTS6TN32K0
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_PAGER: ""
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo '::error::Set repository variable AWS_ROLE_ARN using the CloudFormation DeploymentRoleArn output. See docs/DEPLOYMENT.md.'
            exit 1
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fire-meong-${{ github.run_id }}
          role-duration-seconds: 1800
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Upload hashed assets first
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp dist/assets/ "s3://$S3_BUCKET/assets/" --recursive \
            --cache-control 'public,max-age=31536000,immutable' --only-show-errors
      - name: Upload public files
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp dist/ "s3://$S3_BUCKET/" --recursive \
            --exclude 'assets/*' --exclude 'index.html' \
            --cache-control 'public,max-age=300,must-revalidate' --only-show-errors
      - name: Publish index last
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors
      - name: Invalidate CloudFront and wait
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation: $invalidation_id"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CF_DISTRIBUTION_ID" --id "$invalidation_id"
          echo 'Deployment and cache invalidation completed.' >> "$GITHUB_STEP_SUMMARY"
